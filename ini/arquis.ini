#
# ARQUIS - entornos por maquina. El firmware es el mismo; cambia el perfil (Marlin/machine/*.h). Ver docs/arquis/MAQUINAS.md
#   pio run -e mks_robin_nano_v3_1_usb_flash_drive_msc   -> Arquis XQ1 (el de siempre)
#   pio run -e aquila_d1                                 -> Aquila D1
#
[env:aquila_d1]
extends     = env:mks_robin_nano_v3_1_usb_flash_drive_msc
build_flags = ${env:mks_robin_nano_v3_1_usb_flash_drive_msc.build_flags} -DARQUIS_MACHINE_AQUILA_D1
